<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAT Agency System</title>
    <meta name="theme-color" content="#0A1A2E" />
    <meta name="description" content="TAT Agency System — نظام إدارة متكامل لوكالات التسويق: عملاء، فواتير، مصاريف، تحصيل، تحليلات مالية، صلاحيات، وأتمتة عبر تليجرام وWebhooks." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TAT Agency System" />
    <meta property="og:description" content="نظام واحد لإدارة وكالتك: العملاء والفواتير والمصاريف والتحصيل والتحليلات — بالعربي والإنجليزي." />
    <meta property="og:image" content="/tat-logo-white.png" />
    <link rel="preload" href="/fonts/tajawal-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try { document.documentElement.setAttribute("data-theme", localStorage.getItem("tat_theme") || "dark"); }
      catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    </script>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      html { background: #050E1A; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
